<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Qazaqsha — учи казахский</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Golos+Text:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2ECDC;
    --paper:#FFFEFA;
    --ink:#16302E;
    --ink-soft:#4B615E;
    --line:#E1D7BE;

    --sky:#1CA7C4;
    --sky-deep:#0E6E86;
    --gold:#EFA90C;
    --gold-deep:#B87F06;

    --a1:#1CA7C4;
    --a1-deep:#0E6E86;
    --a2:#4C8C3E;
    --a2-deep:#33632A;
    --b1:#D98A1F;
    --b1-deep:#A5670F;
    --b2:#A6444C;
    --b2-deep:#7C2F35;

    --good:#2E8B4E;
    --good-bg:#E4F3E7;
    --bad:#C4453F;
    --bad-bg:#FBE7E5;

    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow:0 2px 0 rgba(22,48,46,.08), 0 10px 24px -14px rgba(22,48,46,.35);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#122224;
      --paper:#173032;
      --ink:#F2ECDC;
      --ink-soft:#A9C2BE;
      --line:#264543;
    }
  }
  :root[data-theme="dark"]{
    --bg:#122224;
    --paper:#173032;
    --ink:#F2ECDC;
    --ink-soft:#A9C2BE;
    --line:#264543;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Golos Text', 'Noto Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'PT Serif','Noto Serif', serif; }

  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:28px;
  }

  /* ---------- ornament ---------- */
  .horizon{
    position:relative;
    background:linear-gradient(160deg, var(--sky) 0%, var(--sky-deep) 100%);
    color:#fff;
    padding:30px 22px 46px;
    overflow:hidden;
  }
  .horizon svg.motif{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:.16; pointer-events:none;
  }
  .horizon-top{
    display:flex; align-items:center; justify-content:space-between;
    position:relative; z-index:1;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:36px;height:36px;border-radius:10px;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    color:var(--sky-deep); font-weight:900; font-size:18px;
    flex:none;
  }
  .brand-name{font-weight:700; font-size:17px; letter-spacing:.2px;}
  .stat-pill{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.16);
    padding:6px 11px; border-radius:999px;
    font-weight:700; font-size:13.5px;
  }
  .stats-row{display:flex; gap:8px;}
  .hero-title{
    position:relative; z-index:1;
    font-size:26px; line-height:1.25; margin:26px 0 6px; max-width:20ch;
  }
  .hero-sub{
    position:relative; z-index:1;
    font-size:14.5px; opacity:.92; max-width:34ch; margin:0;
  }

  .wave{
    position:absolute; left:0; right:0; bottom:-1px; height:34px;
    background:var(--bg);
    clip-path:polygon(0 100%,0 40%,4% 30%,8% 40%,12% 22%,16% 40%,20% 30%,24% 42%,28% 24%,32% 42%,36% 30%,40% 42%,44% 26%,48% 42%,52% 30%,56% 42%,60% 24%,64% 42%,68% 30%,72% 40%,76% 22%,80% 40%,84% 30%,88% 40%,92% 24%,96% 40%,100% 30%,100% 100%);
  }

  /* ---------- section ---------- */
  .section{ padding:22px 20px 4px; }
  .section-title{ font-size:15px; font-weight:700; color:var(--ink-soft); margin:0 0 12px; text-transform:none; }

  /* ---------- level path ---------- */
  .path{ display:flex; flex-direction:column; gap:0; padding:4px 4px 8px; }
  .level-node{
    display:flex; gap:14px; align-items:stretch;
    position:relative;
    padding:6px 2px;
  }
  .level-node .stem{
    width:2px; flex:none;
    background:var(--line);
    margin-left:29px;
  }
  .level-node:first-child .stem-top{visibility:hidden;}
  .level-node:last-child .stem-bottom{visibility:hidden;}
  .node-col{ display:flex; flex-direction:column; align-items:center; flex:none; }
  .stem-seg{ width:2px; flex:1; background:var(--line); min-height:10px; }
  .badge{
    width:60px;height:60px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:'PT Serif',serif; font-weight:700; font-size:19px;
    box-shadow:var(--shadow);
    border:3px solid var(--paper);
    flex:none;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .badge:active{ transform:scale(.94); }
  .level-card{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:13px 15px;
    margin:2px 0 14px;
    cursor:pointer;
    display:flex; flex-direction:column; gap:3px;
  }
  .level-card .lv-name{ font-weight:700; font-size:15.5px; }
  .level-card .lv-sub{ font-size:12.5px; color:var(--ink-soft); }
  .lv-progress{
    margin-top:6px; height:6px; border-radius:4px; background:var(--line); overflow:hidden;
  }
  .lv-progress > div{ height:100%; border-radius:4px; }

  /* ---------- unit list ---------- */
  .unit-card{
    display:flex; align-items:center; gap:13px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 15px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .unit-icon{
    width:44px;height:44px;border-radius:12px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg); color:var(--sky-deep);
  }
  .unit-icon svg{ width:22px; height:22px; }
  .unit-title{ font-weight:700; font-size:14.5px; }
  .unit-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .unit-check{
    margin-left:auto; width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex:none;
    background:var(--good-bg); color:var(--good);
  }
  .back-row{
    display:flex; align-items:center; gap:10px; padding:18px 20px 6px;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line); background:var(--paper);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--ink); flex:none;
  }
  .level-head-title{ font-weight:700; font-size:18px; }
  .level-head-sub{ font-size:13px; color:var(--ink-soft); }

  /* ---------- exercise screen ---------- */
  .ex-top{
    display:flex; align-items:center; gap:12px; padding:16px 18px 4px;
  }
  .ex-progress{
    flex:1; height:10px; border-radius:6px; background:var(--line); overflow:hidden;
  }
  .ex-progress > div{ height:100%; background:var(--sky); border-radius:6px; transition:width .25s ease; }
  .hearts{ display:flex; gap:3px; align-items:center; flex:none; }
  .hearts svg{ width:19px; height:19px; }

  /* explicit icon sizing everywhere an inline SVG is used without its own width/height attrs */
  .icon-btn svg{ width:18px; height:18px; }
  .unit-check svg{ width:14px; height:14px; }
  .feedback-row svg{ width:20px; height:20px; flex:none; }
  .result-badge svg{ width:46px; height:46px; }
  .mic-btn svg{ width:30px; height:30px; }
  .small-btn svg{ width:13px; height:13px; vertical-align:-2px; margin-right:3px; }

  .ex-wrap{ padding:22px 20px 120px; }
  .skill-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:700; letter-spacing:.3px;
    color:var(--sky-deep); background:rgba(28,167,196,.12);
    padding:5px 10px; border-radius:999px; margin-bottom:14px;
  }
  .ex-prompt{ font-size:20px; font-weight:700; line-height:1.4; margin:0 0 4px; }
  .ex-caption{ font-size:13.5px; color:var(--ink-soft); margin:0 0 20px; }

  .sentence-box{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:18px 18px; font-size:19px; line-height:1.6; margin-bottom:22px;
  }
  .blank{
    display:inline-block; min-width:64px; border-bottom:3px solid var(--sky);
    text-align:center; font-weight:700; color:var(--sky-deep);
  }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    text-align:left;
    padding:14px 16px;
    border-radius:var(--radius-md);
    border:2px solid var(--line);
    background:var(--paper);
    font-size:15.5px; font-weight:600; color:var(--ink);
    cursor:pointer;
  }
  .opt:active{ transform:translateY(1px); }
  .opt.selected{ border-color:var(--sky); background:rgba(28,167,196,.08); }
  .opt.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
  .opt.wrong{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  .opt:disabled{ cursor:default; }

  /* ---------- mascot (listening exercises) ---------- */
  .mascot-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom:18px; }
  .mascot-svg{ width:104px; height:104px; overflow:visible; animation:mc-bob 2.6s ease-in-out infinite; }
  @keyframes mc-bob{ 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-5px) rotate(-1.5deg); } }
  .mc-band{ fill:var(--gold); }
  .mc-band-dot{ fill:var(--b2); }
  .mc-pupil{ fill:var(--ink); }
  .mc-cheek{ fill:#E7A6A6; opacity:.45; }
  .mc-line{ stroke:var(--ink); stroke-width:4; fill:none; stroke-linecap:round; }
  .mc-line.thin{ stroke-width:3; }
  .mc-brow{ stroke:#241813; stroke-width:3; fill:none; stroke-linecap:round; }
  .mc-nose{ stroke:#C98E58; stroke-width:2.4; fill:none; stroke-linecap:round; opacity:.7; }
  .mc-collar-seam{ stroke:#0A5468; stroke-width:2; fill:none; opacity:.55; }
  .mc-collar-trim{ stroke:var(--gold); stroke-width:2; fill:none; stroke-dasharray:1 4; stroke-linecap:round; opacity:.9; }
  .mc-mouth-closed{ stroke:var(--ink); stroke-width:3.5; fill:none; stroke-linecap:round; }
  .mc-mouth-open{ fill:var(--b2-deep); opacity:0; }
  .arm-l, .arm-r{ transform-box:fill-box; }
  .arm-l{ transform-origin:95% 15%; }
  .arm-r{ transform-origin:5% 15%; }
  .eyes-happy, .eyes-sad{ opacity:0; }
  .mascot-wrap.happy .eyes-normal{ opacity:0; }
  .mascot-wrap.happy .eyes-happy{ opacity:1; }
  .mascot-wrap.happy .mascot-svg{ animation:mc-happy .6s ease; }
  @keyframes mc-happy{ 0%{transform:translateY(0) scale(1);} 30%{transform:translateY(-16px) scale(1.08);} 60%{transform:translateY(2px) scale(.97);} 100%{transform:translateY(0) scale(1);} }
  .mascot-wrap.sad .eyes-normal{ opacity:0; }
  .mascot-wrap.sad .eyes-sad{ opacity:1; }
  .mascot-wrap.sad .mascot-svg{ animation:mc-sad .5s ease; }
  @keyframes mc-sad{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-4deg) translateX(-3px);} 75%{transform:rotate(4deg) translateX(3px);} }
  .mascot-wrap.talking .arm-l{ animation:mc-flap-l .4s ease-in-out infinite; }
  .mascot-wrap.talking .arm-r{ animation:mc-flap-r .4s ease-in-out infinite; }
  @keyframes mc-flap-l{ 0%,100%{transform:rotate(0);} 50%{transform:rotate(-12deg);} }
  @keyframes mc-flap-r{ 0%,100%{transform:rotate(0);} 50%{transform:rotate(12deg);} }
  .mascot-wrap.talking .mc-mouth-closed{ opacity:0; }
  .mascot-wrap.talking .mc-mouth-open{ animation:mc-talk .28s ease-in-out infinite; }
  @keyframes mc-talk{ 0%,100%{ opacity:1; transform:scaleY(.5); } 50%{ opacity:1; transform:scaleY(1); } }
  .soundwave{ opacity:0; transition:opacity .15s ease; transform-box:fill-box; transform-origin:center; }
  .mascot-wrap.talking .soundwave{ opacity:1; }
  .soundwave rect{ animation:mc-wave .5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; fill:var(--sky-deep); }
  .soundwave rect:nth-child(2){ animation-delay:.12s; }
  .soundwave rect:nth-child(3){ animation-delay:.24s; }
  @keyframes mc-wave{ 0%,100%{transform:scaleY(.4);} 50%{transform:scaleY(1);} }
  .mascot-bubble{ font-size:12.5px; font-weight:700; color:var(--sky-deep); margin-top:8px; min-height:16px; text-align:center; }

  .listen-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:22px; border-radius:var(--radius-md);
    background:var(--sky); color:#fff; border:none;
    font-weight:700; font-size:15px; margin-bottom:22px; cursor:pointer;
  }
  .listen-btn svg{ width:24px; height:24px; }

  .text-input{
    width:100%; padding:15px 16px; font-size:16px;
    border-radius:var(--radius-md); border:2px solid var(--line);
    background:var(--paper); color:var(--ink); font-family:inherit;
    margin-bottom:16px;
  }
  .text-input:focus{ outline:none; border-color:var(--sky); }

  .speak-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:26px 20px; text-align:center; margin-bottom:18px;
  }
  .speak-target{ font-size:22px; font-weight:700; margin:0 0 6px; }
  .speak-hint{ font-size:13.5px; color:var(--ink-soft); margin:0 0 20px; }
  .mic-btn{
    width:78px;height:78px;border-radius:50%; border:none;
    background:var(--gold); color:var(--ink); display:flex; align-items:center; justify-content:center;
    margin:0 auto 12px; cursor:pointer; box-shadow:var(--shadow);
  }
  .mic-btn.listening{ background:var(--bad); color:#fff; animation:pulse 1.1s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(196,69,63,.4);} 70%{box-shadow:0 0 0 14px rgba(196,69,63,0);} 100%{box-shadow:0 0 0 0 rgba(196,69,63,0);} }
  .speak-status{ font-size:13px; color:var(--ink-soft); min-height:18px; }
  .acc-row{ display:flex; align-items:center; gap:10px; margin:10px auto 4px; max-width:260px; }
  .acc-track{ flex:1; height:8px; border-radius:5px; background:var(--line); overflow:hidden; }
  .acc-fill{ height:100%; border-radius:5px; transition:width .3s ease; }
  .acc-num{ font-size:13px; font-weight:700; min-width:36px; text-align:right; }
  .small-btn{
    display:inline-block; margin-top:6px; padding:9px 16px; border-radius:999px;
    border:1px solid var(--line); background:var(--paper); font-size:13px; font-weight:600;
    cursor:pointer; color:var(--ink);
  }

  .footer-bar{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--paper); border-top:1px solid var(--line);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto;
  }
  .footer-bar.state-good{ background:var(--good-bg); border-top-color:var(--good); }
  .footer-bar.state-bad{ background:var(--bad-bg); border-top-color:var(--bad); }
  .feedback-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-weight:700; }
  .feedback-row.good{ color:var(--good); }
  .feedback-row.bad{ color:var(--bad); }
  .feedback-note{ font-size:13px; font-weight:500; color:var(--ink-soft); margin:-4px 0 10px 30px; }
  .btn{
    width:100%; padding:15px; border-radius:var(--radius-md); border:none;
    font-weight:700; font-size:15.5px; cursor:pointer;
    background:var(--line); color:var(--ink-soft);
  }
  .btn.primary{ background:var(--sky-deep); color:#fff; }
  .btn.good{ background:var(--good); color:#fff; }
  .btn.bad{ background:var(--bad); color:#fff; }
  .btn:disabled{ opacity:.55; }

  /* ---------- result ---------- */
  .result-wrap{ padding:40px 26px 30px; text-align:center; }
  .result-badge{
    width:96px;height:96px;border-radius:50%; margin:0 auto 18px;
    background:linear-gradient(160deg, var(--gold), var(--gold-deep));
    display:flex; align-items:center; justify-content:center; color:#fff;
    box-shadow:var(--shadow);
  }
  .result-title{ font-size:23px; margin:0 0 6px; }
  .result-sub{ color:var(--ink-soft); font-size:14.5px; margin:0 0 26px; }
  .result-stats{ display:flex; gap:10px; justify-content:center; margin-bottom:30px; }
  .stat-box{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:14px 18px; min-width:92px;
  }
  .stat-box .num{ font-size:20px; font-weight:700; font-family:'PT Serif',serif; }
  .stat-box .lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  /* ---------- nav row (home) ---------- */
  .nav-row{ display:flex; gap:10px; padding:4px 20px 2px; }
  .nav-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:13px 10px; font-weight:700; font-size:13.5px; cursor:pointer; color:var(--ink);
  }
  .nav-btn svg{ width:18px; height:18px; color:var(--sky-deep); }

  /* ---------- progress / assessment screen ---------- */
  .mastery-hero{
    text-align:center; padding:6px 20px 18px;
  }
  .mastery-ring{
    width:132px; height:132px; border-radius:50%; margin:0 auto 12px;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--sky) calc(var(--pct,0)*1%), var(--line) 0);
    position:relative;
  }
  .mastery-ring::before{
    content:''; position:absolute; inset:10px; border-radius:50%; background:var(--paper);
  }
  .mastery-ring .num{ position:relative; font-family:'PT Serif',serif; font-size:30px; font-weight:700; }
  .skill-bar-row{ margin-bottom:16px; }
  .skill-bar-top{ display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; margin-bottom:6px; }
  .skill-bar-top .pct{ color:var(--ink-soft); font-weight:700; }
  .skill-bar-track{ height:10px; border-radius:6px; background:var(--line); overflow:hidden; }
  .skill-bar-fill{ height:100%; border-radius:6px; }
  .skill-bar-empty{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .info-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:14px 16px; font-size:13px; color:var(--ink-soft); line-height:1.5; margin-top:18px;
  }

  /* ---------- leaderboard ---------- */
  .lb-name-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:14px 16px; margin-bottom:16px;
  }
  .lb-name-card label{ font-size:12.5px; color:var(--ink-soft); display:block; margin-bottom:8px; }
  .lb-name-row{ display:flex; gap:8px; }
  .lb-name-row input{
    flex:1; padding:11px 13px; border-radius:var(--radius-sm); border:2px solid var(--line);
    font-family:inherit; font-size:14.5px; background:var(--bg); color:var(--ink);
  }
  .lb-name-row button{
    padding:0 16px; border-radius:var(--radius-sm); border:none; background:var(--sky-deep); color:#fff;
    font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .lb-row{
    display:flex; align-items:center; gap:12px;
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:11px 14px; margin-bottom:8px;
  }
  .lb-row.me{ border-color:var(--sky); background:rgba(28,167,196,.08); }
  .lb-rank{ width:24px; text-align:center; font-weight:700; font-family:'PT Serif',serif; color:var(--ink-soft); flex:none; }
  .lb-name{ flex:1; font-weight:600; font-size:14px; }
  .lb-xp{ font-weight:700; font-size:14px; color:var(--gold-deep); flex:none; }
  .lb-empty{ text-align:center; color:var(--ink-soft); font-size:13.5px; padding:30px 10px; }

  .hidden{ display:none !important; }
  ::selection{ background:var(--gold); color:#16302E; }

  @media (max-width:380px){
    .hero-title{ font-size:22px; }
    .ex-prompt{ font-size:18px; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  "use strict";

  /* ================= DATA ================= */

  var SKILL_LABEL = { vocab:'Словарный запас', writing:'Письмо', listening:'Аудирование', grammar:'Грамматика', speaking:'Говорение' };

  /* ================= STATE / STORAGE ================= */
  var STORE_KEY = 'qazaqApp_v1';
  function blankSkillStats(){
    return {
      vocab:{c:0,t:0}, writing:{c:0,t:0}, listening:{c:0,t:0},
      grammar:{c:0,t:0}, speaking:{c:0,t:0,sumPct:0,attempts:0}
    };
  }
  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(!p.skillStats) p.skillStats = blankSkillStats();
        if(!p.clientId) p.clientId = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
        if(!p.displayName) p.displayName = 'Үйренуші' + Math.floor(1000+Math.random()*9000);
        return p;
      }
    }catch(e){}
    return {
      completed:{}, xp:0, streak:0, lastActive:null,
      skillStats: blankSkillStats(),
      clientId: 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36),
      displayName: 'Үйренуші' + Math.floor(1000+Math.random()*9000)
    };
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){}
  }
  var progress = loadProgress();

  function recordSkill(skill, correct){
    var s = progress.skillStats[skill];
    if(!s) return;
    s.t++; if(correct) s.c++;
    saveProgress(progress);
  }
  function recordSpeaking(pct){
    var s = progress.skillStats.speaking;
    s.attempts++; s.sumPct += pct; s.t++;
    if(pct>=65) s.c++;
    saveProgress(progress);
  }
  function skillPct(skill){
    var s = progress.skillStats[skill];
    if(!s || !s.t) return null;
    return Math.round((s.c/s.t)*100);
  }
  function speakingAvgPct(){
    var s = progress.skillStats.speaking;
    if(!s || !s.attempts) return null;
    return Math.round(s.sumPct/s.attempts);
  }
  function overallMasteryPct(){
    var skills = ['vocab','writing','listening','grammar','speaking'];
    var sum=0, n=0;
    skills.forEach(function(k){ var p = skillPct(k); if(p!==null){ sum+=p; n++; } });
    return n ? Math.round(sum/n) : 0;
  }

  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function touchStreak(){
    var today = todayStr();
    if(progress.lastActive === today) return;
    var y = new Date(); y.setDate(y.getDate()-1);
    var yStr = y.toISOString().slice(0,10);
    if(progress.lastActive === yStr){ progress.streak = (progress.streak||0) + 1; }
    else { progress.streak = 1; }
    progress.lastActive = today;
    saveProgress(progress);
  }

  function levelUnitIds(level){ return level.units.map(function(u){return u.id;}); }
  function levelDoneCount(level){
    var n=0; levelUnitIds(level).forEach(function(id){ if(progress.completed[id]) n++; });
    return n;
  }

  // Kyrgyz is, together with Kazakh, part of the same Kipchak language branch (unlike Turkish/
  // Azerbaijani, which are Oghuz) and uses nearly the same Cyrillic alphabet — ң/ө/ү are shared
  // letters read correctly by a Kyrgyz voice as-is. Only the handful of letters Kyrgyz doesn't
  // have (ә, ғ, қ, ұ, і, һ) need swapping to their nearest Kyrgyz-alphabet equivalent, so far
  // less is lost than romanizing for a Turkish/Azerbaijani engine.
  var KAZ_TO_KYRGYZ = {
    'ә':'а','ғ':'г','қ':'к','ұ':'у','і':'и','һ':'х'
  };
  // Kazakh-specific letters that plain Russian voices either skip or mispronounce —
  // swapped for the nearest Russian letter so at minimum the word is fully read aloud.
  var KAZ_TO_RU_FRIENDLY = {
    'ә':'а','ғ':'г','қ':'к','ң':'н','ө':'о','ұ':'у','ү':'у','һ':'х','і':'и'
  };
  function transliterate(text, map){
    var out = '';
    for(var i=0;i<text.length;i++){
      var ch = text[i], lower = ch.toLowerCase();
      if(Object.prototype.hasOwnProperty.call(map, lower)){
        var rep = map[lower];
        if(ch !== lower && rep.length){ rep = rep.charAt(0).toUpperCase() + rep.slice(1); }
        out += rep;
      } else {
        out += ch;
      }
    }
    return out;
  }
  function textForVoice(text){
    if(voiceMode==='kyrgyz') return transliterate(text, KAZ_TO_KYRGYZ);
    if(voiceMode==='turkic') return transliterate(text, KAZ_TO_TURKIC);
    if(voiceMode==='cyrillic') return transliterate(text, KAZ_TO_RU_FRIENDLY);
    return text;
  }
  // Per-mode rate/pitch tuned for clarity: proxy voices need to be slower than a native one
  // would, and the further the phonology drifts from Kazakh, the more we slow down.
  var VOICE_TUNING = {

    kyrgyz:  { rate:0.85, pitch:1.02 },
    turkic:  { rate:0.82, pitch:1.00 },
    cyrillic:{ rate:0.78, pitch:0.98 },
    none:    { rate:0.85, pitch:1.00 }
  };

  // Among same-language voices, prefer ones whose name suggests a modern/neural engine —
  // those are markedly clearer than old legacy desktop voices most systems also ship.
  function voiceQualityScore(v){
    var n = (v.name||'').toLowerCase();
    var score = 0;
    if(/neural|natural|online|premium|enhanced/.test(n)) score += 3;

    return score;

  function bestVoice(voices, re){
    var matches = voices.filter(function(v){ return re.test(v.lang); });

  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    var voices = window.speechSynthesis.getVoices();
    if(!voices.length) return;
    var v;
    if((v = bestVoice(voices, /^kk/i))){ kkVoice = v; voiceMode = 'native'; return; }
    if((v = bestVoice(voices, /^ky/i))){ kkVoice = v; voiceMode = 'kyrgyz'; return; }
    if((v = bestVoice(voices, /^tr/i))){ kkVoice = v; voiceMode = 'turkic'; return; }
    if((v = bestVoice(voices, /^az/i))){ kkVoice = v; voiceMode = 'turkic'; return; }
    if((v = bestVoice(voices, /^uz/i))){ kkVoice = v; voiceMode = 'turkic'; return; }
    if((v = bestVoice(voices, /^ru/i))){ kkVoice = v; voiceMode = 'cyrillic'; return; }

    pickVoice();

    // shortly after — by then the async voice list has almost always populated.
    setTimeout(pickVoice, 300);
  }
  function speak(text, opts){
    if(!('speechSynthesis' in window)){ if(opts && opts.onend) opts.onend(); return; }
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(textForVoice(text));
      u.lang = kkVoice ? kkVoice.lang : 'kk-KZ';
      if(kkVoice) u.voice = kkVoice;
      var tuning = VOICE_TUNING[voiceMode] || VOICE_TUNING.none;
      u.rate = tuning.rate;
      u.pitch = tuning.pitch;
      if(opts && opts.onstart) u.onstart = opts.onstart;
      if(opts && opts.onend) { u.onend = opts.onend; u.onerror = opts.onend; }
      window.speechSynthesis.speak(u);

  function normalize(s){

  }
  function similar(a,b){
    a=normalize(a); b=normalize(b);
    if(a===b) return true;
    if(a.length>3 && (b.indexOf(a)>=0 || a.indexOf(b)>=0)) return true;
    return false;
  }
  function levenshtein(a,b){
    var m=a.length, n=b.length;
    if(!m) return n; if(!n) return m;
    var row = new Array(n+1);
    for(var j=0;j<=n;j++) row[j]=j;
    for(var i=1;i<=m;i++){
      var prev = row[0]; row[0]=i;
      for(var j2=1;j2<=n;j2++){
        var tmp = row[j2];
        row[j2] = a[i-1]===b[j2-1] ? prev : 1 + Math.min(prev, row[j2], row[j2-1]);

    var dist = levenshtein(a,b);

    var pct = Math.round((1 - dist/maxLen) * 100);
    return Math.max(0, Math.min(100, pct));
  }

    var el = document.getElementById('lbList');

    var html = '';
    rows.forEach(function(r, i){

      html += '<div class="lb-row'+(mine?' me':'')+'">' +

  function useDb(){
    if(typeof window.claude === 'undefined' || !window.claude.use) return Promise.resolve(null);
    return window.claude.use('db');
  }

  function initLeaderboard(){
    useDb().then(function(db){
      if(!db){
        var el = document.getElementById('lbList');
        if(el) el.innerHTML = '<div class="lb-empty">Рейтинг недоступен в этом окружении</div>';
        return;
      }
      // upsert my current score
      db.collection('leaderboard').doc(progress.clientId).set({
        name: progress.displayName, xp: progress.xp||0, streak: progress.streak||0, updatedAt: Date.now()
      }).catch(function(){});

      var q = db.collection('leaderboard').orderBy('xp','desc').limit(50);
      lbUnsub = q.onSnapshot(function(snap){
        var rows = snap.docs.map(function(d){ var v = d.data()||{}; return {id:d.id, name:v.name, xp:v.xp}; });
        renderLbRows(rows);
      }, function(err){
        var el = document.getElementById('lbList');
        if(el) el.innerHTML = '<div class="lb-empty">Не удалось загрузить рейтинг</div>';
      });
    }).catch(function(){
      var el = document.getElementById('lbList');
      if(el) el.innerHTML = '<div class="lb-empty">Рейтинг недоступен в этом окружении</div>';
    });
  }

  function syncLeaderboardScore(){
    useDb().then(function(db){
      if(!db) return;
      db.collection('leaderboard').doc(progress.clientId).set({
        name: progress.displayName, xp: progress.xp||0, streak: progress.streak||0, updatedAt: Date.now()
      }).catch(function(){});
    }).catch(function(){});
  }

        '<circle cx="59" cy="56" r="3.6" class="mc-pupil"/><circle cx="83" cy="56" r="3.6" class="mc-pupil"/>' +
      '</g>' +
      '<path d="M68 57 Q65 64 68 67" class="mc-nose"/>' +
      '<path d="M61 73 Q70 77 79 73" class="mc-mouth-closed"/>' +
      '<ellipse cx="70" cy="74" rx="6.5" ry="5.5" class="mc-mouth-open"/>' +
      '<circle cx="45" cy="63" r="5.5" class="mc-cheek"/><circle cx="95" cy="63" r="5.5" class="mc-cheek"/>' +
      '<g class="soundwave"><rect x="105" y="45" width="4" height="12" rx="2"/><rect x="113" y="39" width="4" height="24" rx="2"/><rect x="121" y="47" width="4" height="8" rx="2"/></g>' +
    '</svg>';
  }

  function renderExerciseBody(ex){
    var h = '<div class="skill-tag">' + iconSmSkill(ex.skill) + SKILL_LABEL[ex.skill] + '</div>';

    if(ex.type==='choice'){
      h += '<p class="ex-prompt">' + esc(ex.prompt) + '</p>';
      h += '<div class="options">';
      ex.options.forEach(function(o,i){
        h += '<button class="opt" data-val="'+esc(o)+'" onclick="QZ.selectOption(this)">' + esc(o) + '</button>';
      });
      h += '</div>';
    }
    else if(ex.type==='fill'){
      h += '<p class="ex-prompt">Дополните предложение</p>';
      h += '<div class="sentence-box">' + esc(ex.sentence).replace('___','<span class="blank">?</span>').replace(/\n/g,'<br>') + '</div>';
      h += '<div class="options">';
      ex.options.forEach(function(o){
        h += '<button class="opt" data-val="'+esc(o)+'" onclick="QZ.selectOption(this)">' + esc(o) + '</button>';
      });
      h += '</div>';
    }
    else if(ex.type==='listen'){
      h += '<p class="ex-prompt">' + esc(ex.prompt) + '</p>';
      h += '<div class="mascot-wrap" id="mascot">' + mascotSVG() + '<div class="mascot-bubble" id="mascotBubble">Тыңдауға дайынмын!</div></div>';
      h += '<button class="listen-btn" onclick="QZ.playAudio()">' + ICONS.speaker + '<span>Прослушать</span></button>';
      h += '<div class="options">';
      ex.options.forEach(function(o){
        h += '<button class="opt" data-val="'+esc(o)+'" onclick="QZ.selectOption(this)">' + esc(o) + '</button>';
      });
      h += '</div>';
    }
    else if(ex.type==='translate'){
      h += '<p class="ex-prompt">' + esc(ex.prompt) + '</p>';
      h += '<p class="ex-caption">Введите слово на казахском языке</p>';
      h += '<input class="text-input" id="txtInput" type="text" autocomplete="off" placeholder="Ваш ответ..." oninput="QZ.onTextInput(this.value)">';
    }
    else if(ex.type==='speak'){
      h += '<p class="ex-prompt">Повторите вслух</p>';
      h += '<div class="speak-card">' +
        '<p class="speak-target serif">' + esc(ex.target) + '</p>' +
        '<p class="speak-hint">' + esc(ex.hint) + '</p>' +
        '<button class="mic-btn" id="micBtn" onclick="QZ.toggleMic()">' + ICONS.mic + '</button>' +
        '<div class="speak-status" id="speakStatus">Нажмите на динамик, затем повторите фразу</div>' +
        '<div id="speakScore"></div>' +
        '<button class="small-btn" onclick="QZ.playTarget()">' + ICONS.speaker.replace('width="24" height="24"','') + ' Прослушать произношение</button>' +
      '</div>';
    }
    return h;
  }

  function iconSmSkill(skill){
    var map = {vocab:'book', writing:'pencil', listening:'ear', grammar:'pencil', speaking:'mic'};
    return '<span style="display:inline-flex;width:13px;height:13px;">' + ICONS[map[skill]] + '</span>';
  }

  var pendingAnswer = null;

  function wireExerciseInteractions(ex){
    pendingAnswer = null;
    if(ex.type==='speak'){
      // speaking exercises are self-paced; main button becomes "Continue" immediately available after trying
      document.getElementById('mainBtn').disabled = false;
      document.getElementById('mainBtn').textContent = 'Продолжить';
      session.speakTried = false;
    }
  }

  window.QZ = {};

  QZ.selectOption = function(btn){
    if(session.answered) return;
    var opts = btn.parentElement.querySelectorAll('.opt');
    opts.forEach(function(o){ o.classList.remove('selected'); });
    btn.classList.add('selected');
    pendingAnswer = btn.getAttribute('data-val');
    document.getElementById('mainBtn').disabled = false;
  };

  QZ.onTextInput = function(val){
    pendingAnswer = val;
    document.getElementById('mainBtn').disabled = !val.trim();
  };

  QZ.playAudio = function(){
    var ex = session.unit.exercises[session.idx];
    var mascot = document.getElementById('mascot');
    var bubble = document.getElementById('mascotBubble');
    if(mascot) mascot.classList.add('talking');
    if(bubble) bubble.textContent = '…';
    if(mascot && mascot._talkTimeout) clearTimeout(mascot._talkTimeout);
    var stopTalking = function(){
      if(mascot) mascot.classList.remove('talking');
      if(bubble) bubble.textContent = 'Тыңдауға дайынмын!';
    };
    speak(ex.audioText, {
      onend: stopTalking
    });
    // safety fallback in case the browser never fires onend for a short utterance
    if(mascot) mascot._talkTimeout = setTimeout(stopTalking, 2600);
  };
  QZ.playTarget = function(){
    var ex = session.unit.exercises[session.idx];
    speak(ex.target);
  };

  QZ.toggleMic = function(){
    var ex = session.unit.exercises[session.idx];
    var micBtn = document.getElementById('micBtn');
    var status = document.getElementById('speakStatus');
    var scoreEl = document.getElementById('speakScore');
    if(!Recognition){
      status.textContent = 'Распознавание речи недоступно в этом браузере — просто потренируйтесь вслух';
      session.speakTried = true;
      return;
    }
    if(session._rec){ session._rec.stop(); return; }
    try{
      var rec = new Recognition();
      rec.lang = 'kk-KZ';
      rec.interimResults = false;
      rec.maxAlternatives = 3;
      micBtn.classList.add('listening');
      status.textContent = 'Слушаю...';
      if(scoreEl) scoreEl.innerHTML = '';
      rec.onresult = function(e){
        var said = e.results[0][0].transcript;
        session.speakTried = true;
        var best = 0;
        for(var i=0;i<e.results[0].length;i++){
          var pct = speechAccuracyPct(e.results[0][i].transcript, ex.target);
          if(pct>best) best = pct;
        }
        recordSpeaking(best);
        if(best>=80){ status.textContent = 'Отлично! Похоже на «' + ex.target + '»'; status.style.color = 'var(--good)'; }
        else if(best>=50){ status.textContent = 'Неплохо! Вы сказали: «' + said + '»'; status.style.color = 'var(--gold-deep)'; }
        else { status.textContent = 'Вы сказали: «' + said + '». Попробуйте ещё раз.'; status.style.color = 'var(--ink-soft)'; }
        if(scoreEl){
          var barColor = best>=80?'var(--good)':(best>=50?'var(--gold)':'var(--bad)');
          scoreEl.innerHTML = '<div class="acc-row"><div class="acc-track"><div class="acc-fill" style="width:'+best+'%;background:'+barColor+';"></div></div><span class="acc-num">'+best+'%</span></div>';
        }
      };
      rec.onerror = function(){
        status.textContent = 'Не удалось распознать речь — попробуйте ещё раз или продолжайте';
        session.speakTried = true;
      };
      rec.onend = function(){ micBtn.classList.remove('listening'); session._rec = null; };
      session._rec = rec;
      rec.start();
    }catch(e){
      status.textContent = 'Распознавание речи недоступно — просто потренируйтесь вслух';
      session.speakTried = true;
    }
  };

  QZ.onMainBtn = function(){
    var ex = session.unit.exercises[session.idx];
    if(ex.type==='speak'){
      advanceExercise(true);
      return;
    }
    if(!session.answered){
      judgeAnswer(ex);
    } else {
      advanceExercise(session.lastCorrect);
    }
  };

  function updateHeartsDisplay(){
    var el = document.querySelector('.hearts');
    if(!el) return;
    var html = '';
    for(var i=0;i<5;i++){ html += '<span style="color:' + (i<session.hearts?'var(--bad)':'var(--line)') + '">' + ICONS.heart + '</span>'; }
    el.innerHTML = html;
  }

  function judgeAnswer(ex){
    var correct = false;
    if(ex.type==='translate'){
      correct = normalize(pendingAnswer) === normalize(ex.answer);
    } else {
      correct = pendingAnswer === ex.answer;
    }
    session.answered = true;
    session.lastCorrect = correct;
    recordSkill(ex.skill, correct);

    if(ex.type==='listen'){
      var mascot = document.getElementById('mascot');
      var bubble = document.getElementById('mascotBubble');
      if(mascot){
        mascot.classList.remove('talking');
        mascot.classList.add(correct ? 'happy' : 'sad');
      }
      if(bubble){
        var goodLines = ['Жарайсың!','Керемет!','Дәл солай!'];
        var badLines = ['Қайталап көрейік!','Ештеңе етпейді!','Келесіде шығады!'];
        var lines = correct ? goodLines : badLines;
        bubble.textContent = lines[Math.floor(Math.random()*lines.length)];
      }
    }

    // visual feedback on options
    if(ex.type!=='translate'){
      var opts = document.querySelectorAll('.opt');
      opts.forEach(function(o){
        o.setAttribute('disabled','disabled');
        if(o.getAttribute('data-val')===ex.answer) o.classList.add('correct');
        else if(o.classList.contains('selected') && !correct) o.classList.add('wrong');
      });
    } else {
      document.getElementById('txtInput').setAttribute('disabled','disabled');
    }

    var bar = document.getElementById('footerBar');
    var extra = ex.translation ? '<div class="feedback-note">' + esc(ex.translation) + '</div>' : '';
    if(correct){
      session.correct++; session.xp += 10; progress.xp = (progress.xp||0) + 10; saveProgress(progress);
      bar.className = 'footer-bar state-good';
      bar.innerHTML = '<div class="feedback-row good">' + ICONS.check.replace('width="24" height="24"','width="20" height="20"') + ' Правильно!</div>' + extra +
        '<button class="btn good" onclick="QZ.onMainBtn()">Продолжить</button>';
    } else {
      session.hearts = Math.max(0, session.hearts-1);
      updateHeartsDisplay();
      bar.className = 'footer-bar state-bad';
      var correctText = ex.answer ? ('Правильный ответ: ' + ex.answer) : '';
      bar.innerHTML = '<div class="feedback-row bad">' + ICONS.close.replace('width="24" height="24"','width="20" height="20"') + ' Неверно</div>' +
        '<div class="feedback-note">' + esc(correctText) + '</div>' + extra +
        '<button class="btn bad" onclick="QZ.onMainBtn()">Продолжить</button>';
    }
  }

  function advanceExercise(wasCorrect){
    if(session.hearts<=0){
      finishSession(false);
      return;
    }
    session.idx++;
    session.answered = false;
    if(session.idx >= session.unit.exercises.length){
      finishSession(true);
    } else {
      renderExercise();
    }
  }

  QZ.exitSession = function(){
    session = null;
    go('level', {levelId: view.levelId});
  };

  function finishSession(completedAll){
    var s = session;
    var firstTime = !progress.completed[s.unit.id];
    if(completedAll && s.hearts>0 && firstTime){
      progress.completed[s.unit.id] = true;
      progress.xp = (progress.xp||0) + 20;
      s.xp += 20;
      touchStreak();
      saveProgress(progress);
    } else if(completedAll && s.hearts>0){
      touchStreak();
      saveProgress(progress);
    }
    syncLeaderboardScore();
    go('result', { outcome: (completedAll && s.hearts>0) ? 'done' : 'out-of-hearts', earnedXP: s.xp, correct: s.correct, total: s.unit.exercises.length, levelId: s.levelId });
  }

  function renderResult(){
    var success = view.outcome==='done';
    var html = '<div class="result-wrap">';
    html += '<div class="result-badge">' + (success ? ICONS.trophy.replace('width="24" height="24"','width="46" height="46"') : ICONS.heartOutline.replace(/width="24" height="24"/,'width="46" height="46"')) + '</div>';
    html += '<h2 class="result-title serif">' + (success ? 'Керемет! Урок пройден' : 'Сердечки закончились') + '</h2>';
    html += '<p class="result-sub">' + (success ? 'Вы завершили урок — так держать!' : 'Ничего страшного, попробуйте урок ещё раз') + '</p>';
    html += '<div class="result-stats">' +
      '<div class="stat-box"><div class="num">+' + view.earnedXP + '</div><div class="lbl">Очки опыта</div></div>' +
      '<div class="stat-box"><div class="num">' + view.correct + '/' + view.total + '</div><div class="lbl">Правильных</div></div>' +
    '</div>';
    html += '<button class="btn primary" onclick="QZ.backToLevel()">Продолжить</button>';
    app.innerHTML = html;
  }

  QZ.backToLevel = function(){
    var levelId = view.levelId;
    session = null;
    go('level', {levelId: levelId});
  };

  QZ.openLevel = function(id){ go('level', {levelId:id}); };
  QZ.goHome = function(){ go('home'); };
  QZ.startUnit = function(levelId, unitId){ startUnit(levelId, unitId); };
  QZ.openProgress = function(){ go('progress'); };
  QZ.openLeaderboard = function(){ go('leaderboard'); };
  QZ.saveName = function(){
    var input = document.getElementById('lbNameInput');
    var val = (input && input.value || '').trim().slice(0,24);
    if(!val) return;
    progress.displayName = val;
    saveProgress(progress);
    syncLeaderboardScore();
  };

  /* ================= INIT ================= */
  render();
})();
</script>
</body>
</html>
